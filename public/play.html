<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#070C2E" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Buzz In</title>
<style>
  :root{--ink:#070C2E;--cream:#F5F1E6;--brass:#E8B23A;--buzz:#FF4D6D;--good:#3ED598;
    --cond:"Arial Narrow","Franklin Gothic Medium",Impact,sans-serif;
    --serif:Georgia,"Times New Roman",serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{background:var(--ink);color:var(--cream);font-family:var(--cond);
    display:flex;flex-direction:column;user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .bar{display:flex;justify-content:space-between;align-items:baseline;padding:1rem;font-size:.75rem;
    letter-spacing:.22em;text-transform:uppercase;color:rgba(245,241,230,.55)}
  .bar .team{color:var(--brass);letter-spacing:.14em}
  .score{font-size:1.6rem;color:var(--brass);letter-spacing:0}
  .ddflag{text-align:center;font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;
    color:var(--brass);padding:.2rem}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1rem}

  .panel{width:100%;max-width:23rem;display:flex;flex-direction:column;gap:.9rem}
  h1{font-size:1.9rem;margin:0;letter-spacing:.08em;text-transform:uppercase;text-align:center}
  input[type=text]{width:100%;padding:1rem;font-size:1.3rem;border-radius:8px;
    border:1px solid rgba(245,241,230,.2);background:rgba(255,255,255,.06);color:var(--cream);
    font-family:var(--cond);text-align:center;letter-spacing:.1em;text-transform:uppercase}
  .go{padding:1rem;font-size:1.1rem;border-radius:8px;border:none;background:var(--brass);color:var(--ink);
    font-family:var(--cond);letter-spacing:.18em;text-transform:uppercase;font-weight:700}
  .teamlist{display:flex;flex-direction:column;gap:.6rem}
  .teamopt{padding:1rem;font-size:1.2rem;border-radius:8px;background:rgba(255,255,255,.06);
    border:1px solid rgba(245,241,230,.2);color:var(--cream);font-family:var(--cond);
    letter-spacing:.12em;text-transform:uppercase}
  .teamopt.sel{border-color:var(--brass);color:var(--brass)}
  .rules{font-family:var(--serif);font-size:.82rem;line-height:1.55;color:rgba(245,241,230,.5);
    padding-left:1.1rem;margin:.4rem 0 0}
  .rules li{margin-bottom:.3rem}
  .eyebrow{font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:rgba(245,241,230,.45);text-align:center}

  .buzzwrap{position:relative;display:flex;align-items:center;justify-content:center}
  .buzzer{width:min(70vw,70vh);aspect-ratio:1;border-radius:50%;border:none;
    background:radial-gradient(circle at 38% 32%, #FF7A92, var(--buzz) 55%, #B21D3C);
    box-shadow:0 1.2rem 0 #7C0F27, 0 1.4rem 2.5rem rgba(0,0,0,.55);
    color:#fff;font-family:var(--cond);font-size:clamp(2rem,9vw,3.5rem);letter-spacing:.14em;
    text-transform:uppercase;transition:transform .06s, box-shadow .06s;touch-action:manipulation}
  .buzzer:active,.buzzer.hit{transform:translateY(1rem);box-shadow:0 .2rem 0 #7C0F27}
  .buzzer:disabled{background:radial-gradient(circle at 38% 32%, #2A3468, #141C46 60%, #0C1030);
    box-shadow:0 1.2rem 0 #070C2E;color:rgba(245,241,230,.35)}
  .ring{position:absolute;inset:0;pointer-events:none;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:4;stroke-linecap:round}
  .ring .track{stroke:rgba(245,241,230,.1)}
  .ring .prog{stroke:var(--good);transition:stroke .3s}
  .ring .prog.warn{stroke:var(--brass)}
  .ring .prog.crit{stroke:var(--buzz)}
  .clock{font-size:2.2rem;color:rgba(245,241,230,.75);line-height:1;min-height:2.2rem}
  .clock.crit{color:var(--buzz)}
  .msg{font-family:var(--serif);font-size:1rem;text-align:center;min-height:2.2rem;line-height:1.4}
  .msg.win{color:var(--good);font-size:1.4rem}
  .msg.late{color:rgba(245,241,230,.5)}
  .link{background:none;border:none;color:rgba(245,241,230,.45);font-family:var(--cond);
    font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:underline}
  .foot{padding:.8rem;text-align:center;font-size:.7rem;letter-spacing:.16em;
    text-transform:uppercase;color:rgba(245,241,230,.3)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="bar">
    <span id="who">Not joined</span>
    <span class="team" id="teamLabel"></span>
    <span class="score" id="score"></span>
  </div>
  <div class="ddflag" id="ddflag"></div>
  <div class="stage" id="stage"></div>
  <div class="foot" id="conn">connecting…</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const RULES = [
  "The host reads the clue, then buzzers open.",
  "First tap wins it.",
  "Once you buzz, the clock starts — running it out counts as wrong.",
  "Miss it and your whole team is out of that clue.",
  "Daily Doubles pay double, both ways.",
  "One buzz each per clue."
];

const socket = io();
let playerId = localStorage.getItem('bb_playerId');
if(!playerId){ playerId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random()); localStorage.setItem('bb_playerId', playerId); }
let myName = localStorage.getItem('bb_name') || '';
let joined=false, S=null, pickingTeam=false, clockOffset=0, tickHandle=null;

const stage=document.getElementById('stage');
const el=(t,cls,txt)=>{const e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};

function join(name){
  myName=String(name||'').trim();
  if(!myName) return;
  localStorage.setItem('bb_name',myName);
  socket.emit('player:join',{playerId,name:myName});
  joined=true; render();
}

socket.on('connect',()=>{
  document.getElementById('conn').textContent='connected';
  if(myName){ socket.emit('player:join',{playerId,name:myName}); joined=true; }
});
socket.on('disconnect',()=>{ document.getElementById('conn').textContent='reconnecting…'; });
socket.on('state',(s)=>{ S=s; clockOffset=s.serverNow-Date.now(); render(); });

const me=()=>S&&S.players.find(p=>p.id===playerId);
const myTeam=()=>{const m=me();return m&&m.teamId?S.teams.find(t=>t.id===m.teamId):null;};
function msLeft(){
  if(!S||!S.timer) return null;
  if(S.timer.paused) return S.timer.remaining;
  return Math.max(0,S.timer.endsAt-(Date.now()+clockOffset));
}

function render(){
  if(!S) return;
  const m=me(), t=myTeam();
  document.getElementById('who').textContent = m?m.name:(joined?myName:'Not joined');
  document.getElementById('teamLabel').textContent = t?t.name:'';
  const holder=S.teamsOn?t:m;
  document.getElementById('score').textContent = holder?((holder.score<0?'-$':'$')+Math.abs(holder.score).toLocaleString()):'';
  document.getElementById('ddflag').textContent =
    (S.activeClue && S.activeClue.dailyDouble && !S.activeClue.ddSplash) ? 'Daily Double — double points' : '';
  stage.innerHTML='';

  if(!m){
    joined=false;
    const p=el('div','panel');
    p.append(el('h1','','Buzz in'));
    const inp=el('input'); inp.type='text'; inp.placeholder='Your name'; inp.maxLength=18; inp.value=myName;
    const btn=el('button','go','Join the game');
    btn.onclick=()=>join(inp.value);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') join(inp.value); });
    p.append(inp,btn);
    const ol=el('ol','rules'); RULES.forEach(r=>ol.append(el('li','',r)));
    p.append(el('div','eyebrow','How it works'),ol);
    stage.append(p);
    return;
  }

  if(S.teamsOn && (!t || pickingTeam)){
    const p=el('div','panel');
    p.append(el('h1','', t?'Switch team':'Pick your team'));
    const list=el('div','teamlist');
    S.teams.forEach(tm=>{
      const b=el('button','teamopt'+(t&&t.id===tm.id?' sel':''), tm.name+'  ('+tm.members.length+')');
      b.onclick=()=>{ socket.emit('player:setTeam',{teamId:tm.id}); pickingTeam=false; };
      list.append(b);
    });
    p.append(list);
    if(t){ const c=el('button','link','Never mind'); c.onclick=()=>{pickingTeam=false;render();}; p.append(c); }
    stage.append(p);
    return;
  }

  const wrapB=el('div','buzzwrap');
  const b=el('button','buzzer');
  const armed=S.buzzer.armed;
  const mine=S.buzzer.order.find(o=>o.id===playerId);
  const first=S.buzzer.order[0];
  const lockedEntry=S.buzzer.order.find(o=>o.id===S.buzzer.lockedBy);
  const iAmUp=S.buzzer.lockedBy===playerId;
  const myTeamIsUp=S.teamsOn&&t&&lockedEntry&&lockedEntry.teamId===t.id;
  const teamOut=S.teamsOn&&t&&S.buzzer.outTeams.includes(t.id);
  const msg=el('div','msg');

  if(iAmUp){
    b.textContent='You!'; b.disabled=true; b.classList.add('hit');
    msg.className='msg win'; msg.textContent='You buzzed first — answer now.';
  } else if(myTeamIsUp){
    b.textContent='Team'; b.disabled=true;
    msg.className='msg win'; msg.textContent=lockedEntry.name+' is answering for you.';
  } else if(teamOut){
    b.textContent='Out'; b.disabled=true;
    msg.className='msg late'; msg.textContent='Your team is out of this clue. Next one is fair game.';
  } else if(mine){
    b.textContent='In'; b.disabled=true;
    msg.className='msg late';
    msg.textContent = first&&first.id!==playerId
      ? (first.teamName||first.name)+' got there '+mine.delta+'ms ahead.'
      : 'Buzz registered — waiting on the host.';
  } else if(armed && S.mode==='feud'){
    b.textContent='Buzz';
    b.onpointerdown=(e)=>{ e.preventDefault(); socket.emit('player:buzz'); if(navigator.vibrate) navigator.vibrate(35); };
    msg.textContent='Face-off — first buzz plays the board.';
  } else if(armed){
    b.textContent='Buzz';
    b.onpointerdown=(e)=>{ e.preventDefault(); socket.emit('player:buzz'); if(navigator.vibrate) navigator.vibrate(35); };
    msg.textContent='Buzzers are open.';
  } else {
    b.textContent='Wait'; b.disabled=true;
    msg.textContent = S.mode==='feud'
      ? 'Shout your answers out — the host is working the board.'
      : (S.buzzer.expired ? 'Time — nobody buzzed.'
        : (S.buzzer.lockedBy ? 'Someone else is answering.' : 'Hold tight — buzzers are locked.'));
  }

  // countdown ring around the button
  const ring=document.createElementNS('http://www.w3.org/2000/svg','svg');
  ring.setAttribute('class','ring'); ring.setAttribute('viewBox','0 0 100 100');
  ring.innerHTML='<circle class="track" cx="50" cy="50" r="48"/><circle class="prog" id="prog" cx="50" cy="50" r="48"/>';
  wrapB.append(b,ring);

  const clock=el('div','clock',''); clock.id='clockNum';
  stage.append(wrapB,clock,msg);

  if(S.teamsOn){
    const sw=el('button','link','Switch team');
    sw.onclick=()=>{ pickingTeam=true; render(); };
    stage.append(sw);
  }
  startTicking();
}

function startTicking(){
  if(tickHandle) cancelAnimationFrame(tickHandle);
  const prog=document.getElementById('prog');
  const clock=document.getElementById('clockNum');
  if(!prog) return;
  const C=2*Math.PI*48;
  prog.style.strokeDasharray=C;
  const step=()=>{
    const left=msLeft();
    if(left===null||!S.timer){
      prog.style.strokeDashoffset=C;
      if(clock) clock.textContent='';
      return;
    }
    const frac=Math.max(0,Math.min(1,left/(S.timer.seconds*1000)));
    prog.style.strokeDashoffset=C*(1-frac);
    prog.setAttribute('class','prog'+(left<3000?' crit':(left<5000?' warn':'')));
    if(clock){ clock.textContent=Math.ceil(left/1000); clock.className='clock'+(left<3000?' crit':''); }
    tickHandle=requestAnimationFrame(step);
  };
  step();
}

document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
render();
</script>
</body>
</html>
